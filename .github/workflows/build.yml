name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-uf2
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "1G"
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 git ccache \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Initialize submodules
        run: tools/bootstrap.sh

      - name: Restore Pico Keys dependencies
        uses: actions/cache@v6
        with:
          path: third_party/pico-keys-sdk/third-party
          key: ${{ runner.os }}-picokeys-deps-${{ hashFiles('versions.lock') }}
          restore-keys: |
            ${{ runner.os }}-picokeys-deps-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('versions.lock', 'patches/**', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'boards/**', 'tools/gen_files.py') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Apply patches
        run: tools/apply-patches.sh

      - name: Build rp2350-usb default (base)
        run: tools/build.sh --board pico_aio_rp2350_usb --profile default

      - name: Build rp2350-usb yubikey5
        run: tools/build.sh --board pico_aio_rp2350_usb --profile yubikey5

      - name: Build pico2 default
        run: tools/build.sh --board pico2 --profile default

      - name: Build pico2 yubikey5
        run: tools/build.sh --board pico2 --profile yubikey5

      - name: ccache stats
        run: ccache --show-stats

      - uses: actions/upload-artifact@v7
        with:
          name: pico-aio-uf2
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.uf2 *.elf > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
